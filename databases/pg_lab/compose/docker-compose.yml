name: pg-lab

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: pg-lab-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    volumes:
      - etcddata:/etcd-data
    ports:
      - "2379:2379"
    deploy:
      resources:
        limits:
          memory: 128M

  pg1:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: pg-lab/postgres:16-pgbackrest
    container_name: pg-lab-pg1
    user: postgres
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec patroni /etc/patroni/patroni.yml"]
    environment:
      PATRONI_NAME: pg1
      PATRONI_SCOPE: pg-lab
    volumes:
      - pg1data:/home/postgres/pgdata
      - pgbackrest_spool:/var/spool/pgbackrest
      - ../config/patroni/patroni-pg1.yml:/etc/patroni/patroni.yml:ro
      - ../config/patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ../app/seed:/seed:ro   
      - ../config/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    ports:
      - "5432:5432"
      - "8008:8008"
    depends_on:
      - etcd
    deploy:
      resources:
        limits:
          memory: 512M

  pg2:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: pg-lab/postgres:16-pgbackrest
    container_name: pg-lab-pg2
    user: postgres
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec patroni /etc/patroni/patroni.yml"]
    environment:
      PATRONI_NAME: pg2
      PATRONI_SCOPE: pg-lab
    volumes:
      - pg2data:/home/postgres/pgdata
      - pgbackrest_spool:/var/spool/pgbackrest
      - ../config/patroni/patroni-pg2.yml:/etc/patroni/patroni.yml:ro
      - ../config/patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ../app/seed:/seed:ro   
      - ../config/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    ports:
      - "8009:8008"
    depends_on:
      - etcd
    deploy:
      resources:
        limits:
          memory: 512M

  pg3:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: pg-lab/postgres:16-pgbackrest
    container_name: pg-lab-pg3
    user: postgres
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec patroni /etc/patroni/patroni.yml"]
    environment:
      PATRONI_NAME: pg3
      PATRONI_SCOPE: pg-lab
    volumes:
      - pg3data:/home/postgres/pgdata
      - pgbackrest_spool:/var/spool/pgbackrest
      - ../config/patroni/patroni-pg3.yml:/etc/patroni/patroni.yml:ro
      - ../config/patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ../app/seed:/seed:ro   
      - ../config/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    ports:
      - "8010:8008"
    depends_on:
      - etcd
    deploy:
      resources:
        limits:
          memory: 512M

  haproxy:
    image: haproxy:2.9
    container_name: pg-lab-haproxy
    volumes:
      - ../config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5000:5000"   # primary
      - "5001:5001"   # standby
    depends_on:
      - pg1
      - pg2
      - pg3
    deploy:
      resources:
        limits:
          memory: 64M

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: pg-lab-pgbouncer
    environment:
      DB_HOST: haproxy
      DB_PORT: "5000"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      - haproxy
    deploy:
      resources:
        limits:
          memory: 64M

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pg-lab-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@haproxy:5000/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - haproxy
    deploy:
      resources:
        limits:
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pg-lab-prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - postgres_exporter
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pg-lab-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  localstack:
    image: localstack/localstack:3.7
    container_name: pg-lab-localstack
    environment:
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "1"
    volumes:
      - localstackdata:/var/lib/localstack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  localstack-init:
    image: amazon/aws-cli:2.17.0
    container_name: pg-lab-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://localstack:4566 s3 mb s3://pgbackrest || true;
      exit 0
      "

volumes:
  etcddata:
  pg1data:
  pg2data:
  pg3data:
  pgbackrest_spool:
  localstackdata:
  promdata:
  grafanadata: