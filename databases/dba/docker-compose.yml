services:
  server-1:
    build: .
    container_name: ${SERVER_1_NAME}
    hostname: ${SERVER_1_NAME}
    restart: unless-stopped
    networks:
      - pg-net
    ports:
      - "${SERVER_1_PORT}:22"

  server-2:
    build: .
    container_name: ${SERVER_2_NAME}
    hostname: ${SERVER_2_NAME}
    restart: unless-stopped
    networks:
      - pg-net
    ports:
      - "${SERVER_2_PORT}:22"

  server-3:
    build: .
    container_name: ${SERVER_3_NAME}
    hostname: ${SERVER_3_NAME}
    restart: unless-stopped
    networks:
      - pg-net
    ports:
      - "${SERVER_3_PORT}:22"

networks:
  pg-net:
    driver: bridge